name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
#  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results
  security-events: write # allows OWASP DAST to show results in the Security tab
  contents: write # allows OWASP DAST to create issues/reports
  issues: write # Allows OWASP DAST to post the scan results as an issue

jobs:
